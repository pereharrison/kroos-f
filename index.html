<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>

    <title>Kroos</title>
    <style>
      table {
        border: 1px solid black;
      }
      th {
        border: 1px solid black;
      }
      td {
        border: 1px solid black;
      }
      a {
        text-decoration: none;
        color: black;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div><span>Kroos</span> is the language of the future.</div>
    <button>
      <a href="./addword.html" title="Add new word"
        ><i class="fa-solid fa-plus"></i
      ></a>
    </button>
    <form id="search-form">
      <label for="searchWord">Search for a word</label>
      <input type="text" placeholder="e.g wait" id="searchWord" />
      <button type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </form>
    <div>
      <table>
        <tr>
          <th>Kroos</th>
          <th>English</th>
          <th>Meaning</th>
        </tr>

        <tbody id="word-body"></tbody>
      </table>
    </div>

    <form id="suggestion-form">
      <label for="suggestion">Suggest a word</label>
      <input
        type="text"
        placeholder="English suggestion"
        id="english-suggestion"
        />
      <input type="text" placeholder="Kroos suggestion" id="kroos-suggestion" />
      <button type="submit">Suggest</button>
    </form>
    <p id="message"></p>
    <p id="suggestion-message"></p>

    <script>
      const suggestForm = document.getElementById("suggestion-form");
      const searchForm = document.getElementById("search-form");

      const getWords = async () => {
        const wordBody = document.getElementById("word-body");
        const message = document.getElementById("message");
        try {
          const res = await axios.get(
            "https://kroos.onrender.com/word/all-words",
          );
          console.log(res.data);

          // manipulate
          res.data.data.forEach((word) => {
            wordBody.innerHTML += `
                 <tr>
                     <td><a href="./details.html?id=${word._id}">${word.kroos}</a></td>
                     <td><a href="./details.html?id=${word._id}">${word.english}</a></td>
                     <td><a href="./details.html?id=${word._id}">${word.meaning}</a></td>
                 </tr>
                 `;
          });
        } catch (error) {
          console.error;
          message.textContent = error.message;
        }
      };

      suggestForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("suggestion-message");
        try {
          const suggestionData = {
            kroosSuggestion: document.getElementById("kroos-suggestion").value,
            englishSuggestion: document.getElementById("english-suggestion").value,
          };

          const res = await axios.post(
            "https://kroos.onrender.com/word/suggest-word",
             suggestionData ,
          );
          message.textContent = `${suggestionData.kroosSuggestion} has been suggested successfully!`;
        } catch (error) {
          console.error(error.response?.data);
          console.error(error);
        }
      });

      searchForm.addEventListener("submit", async (e) => {
        try {
          e.preventDefault();

          let searchValue = document.getElementById("searchWord").value.trim();
          const wordBody = document.getElementById("word-body");

          const res = await axios.get(
            `http://localhost:4000/word/${searchValue}`,
          );
          const word = res.data.data;

          wordBody.innerHTML = `
               <tr>
                 <td><a href="./details.html?id=${word._id}">${word.kroos}</a></td>
                 <td><a href="./details.html?id=${word._id}">${word.english}</a></td>
                 <td><a href="./details.html?id=${word._id}">${word.meaning}</a></td>
               </tr>
             `;
        } catch (error) {
          console.log(error);
        }
      });

      getWords();
    </script>
  </body>
</html>
