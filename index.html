<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>

    <title>Kroos</title>
    <style>
      table {
        border: 1px solid black;
      }
      th {
        border: 1px solid black;
      }
      td {
        border: 1px solid black;
      }
      a {
        text-decoration: none;
        color: black;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div><span>Kroos</span> is the language of the future.</div>

    <form id="search-form">
      <label for="searchWord">Search for a word</label>
      <input type="text" placeholder="e.g wait" id="searchWord" />
      <button type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </form>

    <!-- display words -->
    <div>
      <table>
        <tr>
          <th>Kroos</th>
          <th>English</th>
          <th>Meaning</th>
        </tr>

        <tbody id="word-body"></tbody>
      </table>
    </div>

    <!-- Suggestion section -->
    <form id="suggestion-form">
      <div>
        <label for="suggestion">Enter english word</label>
        <input
          type="text"
          placeholder="English suggestion"
          id="english-suggestion"
        />
      </div>
      <div>
        <label for="kroos-suggestion">Enter kroos word</label>
        <input
          type="text"
          placeholder="Kroos suggestion"
          id="kroos-suggestion"
        />
      </div>
      <div>
        <label for="contact-suggestor" title="A way for us to contact"
          >Enter social media contact:</label
        >
        <input
          type="text"
          placeholder="e.g peresomebody"
          id="contact-suggestor"
        />
      </div>
      <div>
        <label for="contact-platform">Select contact platform</label>
        <select name="contact-platform" id="contact-platform">
          <option value="tiktok">Tiktok</option>
          <option value="instagram">Instagram</option>
          <option value="twitter">X</option>
        </select>
      </div>

      <button type="submit">Suggest</button>
    </form>
    <p id="message"></p>
    <p id="suggestion-message" style="color: red"></p>

    <script>
      const suggestForm = document.getElementById("suggestion-form");
      const searchForm = document.getElementById("search-form");
      const message = document.getElementById("message");

      // all words
      const getWords = async () => {
        const wordBody = document.getElementById("word-body");
        const message = document.getElementById("message");
        try {
          const res = await axios.get(
            "https://kroos.onrender.com/word/all-words",
          );
          console.log(res.data);

          // manipulate
          res.data.data.forEach((word) => {
            wordBody.innerHTML += `
                 <tr>
                     <td><a href="./details.html?id=${word._id}">${word.kroos}</a></td>
                     <td><a href="./details.html?id=${word._id}">${word.english}</a></td>
                     <td><a href="./details.html?id=${word._id}">${word.meaning}</a></td>
                 </tr>
                 `;
          });
        } catch (error) {
          console.error;
          message.textContent = error.message;
        }
      };

      suggestForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("suggestion-message");
        try {
          const suggestionData = {
            kroosSuggestion: document
              .getElementById("kroos-suggestion")
              .value.toLowerCase(),
            englishSuggestion: document
              .getElementById("english-suggestion")
              .value.toLowerCase(),
            contactSuggestor: document
              .getElementById("contact-suggestor")
              .value.toLowerCase(),
            contactPlatform: document.getElementById("contact-platform").value,
          };

          const res = await axios.post(
            "http://localhost:4000/word/suggest-word",
            suggestionData,
          );
          message.textContent = `${suggestionData.kroosSuggestion} has been suggested successfully!`;
          message.style.color = "green"
        } catch (error) {
          console.error(error.response?.data);
          message.textContent =
            error.response?.data?.message || "Something went wrong.";
        }
      });

      searchForm.addEventListener("submit", async (e) => {
        try {
          e.preventDefault();

          let searchValue = document.getElementById("searchWord").value.trim();
          const wordBody = document.getElementById("word-body");

          const res = await axios.get(
            `https://kroos.onrender.com/word/${searchValue}`,
          );
          const word = res.data.data;

          wordBody.innerHTML = `
               <tr>
                 <td><a href="./details.html?id=${word._id}">${word.kroos}</a></td>
                 <td><a href="./details.html?id=${word._id}">${word.english}</a></td>
                 <td><a href="./details.html?id=${word._id}">${word.meaning}</a></td>
               </tr>
             `;
        } catch (error) {
          console.log(error);
          message.textContent =
            error.response?.data?.message || "Something went wrong.";
          message.style.color = "red";
        }
      });

      getWords();
    </script>
  </body>
</html>
